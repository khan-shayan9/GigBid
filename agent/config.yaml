marketplace:
  mode: gigsim  # gigsim | upwork_live; the MARKETPLACE_MODE env var overrides it
  max_requests_per_minute: 20
  upwork_live:
    url: https://mcp.upwork.com/mcp
    # Port method -> Upwork MCP tool name. Empty until a real sign-in lists Upwork's tools
    # (python -m mcp_servers.marketplace.adapters.upwork_live login --user <user>).
    tools:
      search_jobs: null
      get_job: null
      get_client_history: null
      get_connects_balance: null
      list_messages: null
      create_proposal_draft: null

models:
  # Default profile; the MODEL_PROFILE env var overrides it.
  profile: open
  profiles:
    # open: open-weight models only (required; the deployed link runs on this).
    # Groq IDs checked against our key's /models list (2026-11-15; the Llama IDs are gone).
    # qwen/qwen3.8-27b is the second open configuration to compare. OpenRouter uses different
    # IDs, so the fallback needs its own node map (Phase 4-5, with the comparison of two open configurations).
    open:
      provider: groq
      fallback_provider: openrouter
      nodes:
        scout: &open_small openai/gpt-oss-20b
        analyst: *open_small
        risk_assessor: *open_small
        fit_matcher: *open_small
        pricing: *open_small
        compliance: *open_small
        writer: &open_strong openai/gpt-oss-120b
        critic: *open_strong
        client_liaison: *open_strong
        # gpt-oss-20b's free daily quota (200k tokens) ran out during the Phase 4 evals, so the
        # verifier and the retrieval query model run on models with their own quotas.
        verifier: *open_strong
        rag_query: &open_alt qwen/qwen3.8-27b  # V1 requirement split and V8 query rewrite
        # Evaluation only: a different model family from the writer, to limit self-preference.
        judge: *open_alt
      # C7: cheap nodes switch to another model on the same provider (its own quota) when theirs
      # still fails after the client's retries (agent/llm.py).
      # shortcut: same provider, so a Groq outage is not covered; add an OpenRouter node map then.
      fallbacks: &cheap_fallbacks
        scout: *open_alt
        analyst: *open_alt
        risk_assessor: *open_alt
        fit_matcher: *open_alt
        pricing: *open_alt
        compliance: *open_alt
    # paid: optional; used only where it beats `open` enough to justify the cost.
    paid:
      provider: configure-me
      fallback_provider: groq
      nodes:
        scout: *open_small
        analyst: *open_small
        risk_assessor: *open_small
        fit_matcher: *open_small
        pricing: *open_small
        verifier: *open_small
        compliance: *open_small
        rag_query: *open_alt
        writer: &paid_strong configure-me
        critic: *paid_strong
        client_liaison: *paid_strong
        judge: *open_alt
      fallbacks: *cheap_fallbacks
  # Open models in both profiles.
  # fastembed runs nomic-embed-text on CPU in-process (no Ollama). `fake` is for tests only.
  # The quantized nomic-ai/nomic-embed-text-v1.5-Q is smaller if memory is short.
  embeddings:
    provider: fastembed
    model: nomic-ai/nomic-embed-text-v1.5
  # USD per million tokens, per model id, for the cost columns of the eval results. Fill from the
  # provider's pricing page with the date checked; a model missing here is reported in tokens only.
  prices_usd_per_million: {}
  # ADR 0005: bge-reranker-v2-m3 (int8) took ~2 s a pair on the dev CPU, too slow to evaluate;
  # this open MS MARCO cross-encoder took 0.18 s a pair in an ad-hoc timing (m3 int8: 1.25 s). BAAI/bge-reranker-v2-m3-int8 is a drop-in.
  reranker:
    provider: fastembed
    model: Xenova/ms-marco-MiniLM-L-12-v2

# Retrieval (Part B). A variant is a set of switches over the components in rag/variants/;
# RAG_VARIANT overrides `variant`, RAG_INDEX overrides `index`. `variant` is the shipped choice.
rag:
  variant: v1  # shipped: best dev Recall@5, MRR and nDCG@10 (evals/results/rag_retrieval_dev.json)
  index: memory  # memory (local evals, tests) | pgvector (docker compose, CI)
  chunk_words: 120
  chunk_overlap: 20
  candidates: 30  # first-stage depth per query (dense, BM25 and the fused list)
  rerank_depth: 10  # candidates the cross-encoder rescores
  rrf_k: 60  # reciprocal rank fusion constant (Cormack et al., 2009)
  corrective:  # V8
    min_score: 0.0  # reranker score a hit needs to count as evidence; untuned (MiniLM logit 0)
    max_requeries: 1
  variants:
    v0: {}
    v1: {decompose: true}
    v2: {hybrid: true}
    v3: {rerank: true}
    v8: {rerank: true, corrective: true}
    # Combinations for the R&D B hypothesis and the shipped choice.
    v1_v2: {decompose: true, hybrid: true}
    v1_v2_v3: {decompose: true, hybrid: true, rerank: true}

budgets:
  # Over a budget the thread stops with status needs_attention (agent/graphs/guard.py).
  max_graph_steps: 30
  max_revisions: 2
  max_tokens_per_job: 12000
  # A node whose dependency is down (incl. GigSim 429/5xx) is retried, then dead-lettered.
  node_retries: 2
  node_backoff_s: 2.0

policy:
  version: v2  # data/policy_pack/<version>.yaml; v2 is the 2 Nov 2026 policy update (assumed)

risk:
  # Risk Assessor signals: written for the agent, independent of data/pipeline's label rules.
  unverified_client_weight: 0.3
  signals:
    - {id: injected_instructions, weight: 0.8, pattern: 'ignore (all |any )?(previous|prior|your|the above) (instructions|rules)|system prompt|you are now'}
    - {id: account_access, weight: 0.8, pattern: '(send|share|give) (us |me )?your (password|login|credentials)|log ?in to (our|my) (client''s )?accounts?'}
    - {id: off_platform, weight: 0.6, pattern: 'whatsapp|telegram|skype|outside (the|this) platform|off[- ]platform'}
    - {id: upfront_payment, weight: 0.6, pattern: '(pay|send|deposit)\b.{0,40}\b(fee|deposit|upfront|crypto|wallet)'}
    - {id: free_work, weight: 0.4, pattern: '(unpaid|free) (test|trial|sample)'}

liaison:
  # Client Liaison intent rules, checked in order; the first match wins, else "question".
  intents:
    - {id: scam_signal, pattern: 'whatsapp|telegram|outside (the|this) platform|gift card|wire (the )?money|your password'}
    - {id: interview_request, pattern: 'interview|call|meet|schedule|availability|available'}
    - {id: negotiation, pattern: 'budget|price|rate|cheaper|discount|lower'}
  slot_window_days: 7

thresholds:
  minimum_fit_score: 0.60
  maximum_risk_score: 0.70

# OpenAI-compatible endpoints for the providers named in the model profiles.
llm_providers:
  timeout_s: 60
  max_retries: 2
  # Reasoning models spend output tokens on thinking; 2048 cut the verifier's JSON short.
  max_tokens: 6000
  groq:
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
  openrouter:
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

mcp:
  # stdio: agent/mcp_client.py starts each server as a local process for one user.
  # http: it calls the running servers with that user's Bearer token (<PREFIX>_MCP_TOKENS).
  transport: stdio
  timeout_s: 30  # per tool call; run `mcp_servers.portfolio.server warm` so searches stay fast
  retries: 2  # extra tries, only for read tools and writes that carry an idempotency key
  servers:
    portfolio: {module: mcp_servers.portfolio.server, url: http://localhost:8083/mcp, env_prefix: PORTFOLIO}
    marketplace: {module: mcp_servers.marketplace.server, url: http://localhost:8082/mcp, env_prefix: MARKETPLACE}
    workspace: {module: mcp_servers.workspace.server, url: http://localhost:8084/mcp, env_prefix: WORKSPACE}
    # Third-party, always HTTP with one read-only token (docs/TOOLS.md has the trust rationale).
    github:
      url: https://api.githubcopilot.com/mcp/
      token_env: GITHUB_PERSONAL_ACCESS_TOKEN
      headers: {X-MCP-Toolsets: repos, X-MCP-Readonly: "true"}
  # The only tools each node may call (A6). Real writes also need an approved interrupt().
  allowlists:
    scout: [search_jobs]
    analyst: []
    risk_assessor: [get_job, get_client_history]
    fit_matcher: [search_evidence, get_case_study, list_skills]
    pricing: [get_job, get_client_history, get_market_rates, get_connects_balance]
    writer: [search_evidence, get_case_study]
    verifier: [search_evidence, get_case_study]
    critic: [search_evidence, get_case_study]
    compliance: []
    client_liaison: [list_messages, find_free_slots, hold_slot, draft_email, send_message]
    submitter: [create_proposal_draft, submit_proposal]
    github_ingest: [search_repositories, get_file_contents, list_commits]  # B1, Phase 4
