[project]
name = "gigbid-student-project"
version = "0.1.0"
description = "Student scaffold for the AI-4016 GigBid assignment"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.163.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.3",
  "pyyaml==6.0.3",
  "langgraph==1.2.22",
  "langchain==1.5.0",
  "langchain-mcp-adapters==0.3.2",
  "mcp==1.30.0",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
  "fastembed==0.9.1",
  "langchain-openai==1.7.4",
  "cryptography==50.0.2",
  "pypdf==6.1.3",
  "psycopg[binary]==3.2.12",
  "langgraph-checkpoint-postgres==3.2.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "ruff==0.17.5", "mypy==2.4.1"]

[tool.ruff]
line-length = 100
# persona repos are corpus text (deliberately messy sample code), not project code
extend-exclude = ["data/personas"]

[tool.uv]
required-version = "==0.11.8"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "mcp_servers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
