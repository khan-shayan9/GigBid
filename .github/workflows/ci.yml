name: CI
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:  # pgvector index tests (tests/integration/test_pgvector.py)
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gigbid
          POSTGRES_PASSWORD: gigbid
          POSTGRES_DB: gigbid
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gigbid -d gigbid" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:  # worker mode test (tests/integration/test_worker.py)
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://gigbid:gigbid@localhost:5432/gigbid
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: GigSim frozen at gigsim-v1
        run: git diff --exit-code refs/tags/gigsim-v1 -- gigsim/
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - run: uv sync --frozen
      - run: make lint test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - run: uv sync --frozen
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Generated API client matches openapi.json
        run: npm run gen:api && git diff --exit-code src/lib/api
      - run: npx tsc --noEmit
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report

  eval-smoke:
    runs-on: ubuntu-latest
    env:
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - run: uv sync --frozen
      - uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('agent/config.yaml') }}
      - name: Smoke eval (30 dev jobs) against the gates in agent/config.yaml
        run: make eval

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait
      - run: curl --fail --silent http://localhost:8000/health
      - run: curl --fail --silent http://localhost:8081/health
      - run: curl --fail --silent --output /dev/null http://localhost:3000/login
      - if: always()
        run: docker compose logs && docker compose down --volumes
